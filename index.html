<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />

    <!--
      Applies the stored theme before first paint. Without this the page would
      render light for a frame and then snap to dark for returning visitors.
      Defaults to light when nothing is stored.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bt:theme')
          var theme = t === 'dark' || t === 'light' ? t : 'light'
          document.documentElement.dataset.theme = theme
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.content = theme === 'dark' ? '#08090b' : '#f7f7f5'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <title>BeginTech — Digital Product & Technology Studio</title>
    <meta
