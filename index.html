    <!--
      Applies the stored theme before first paint. Without this the page would
      render light for a frame and then snap to dark for returning visitors.
      Defaults to light when nothing is stored.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bt:theme')
          var theme = t === 'dark' || t === 'light' ? t : 'light'
          document.documentElement.dataset.theme = theme
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.content = theme === 'dark' ? '#070a0f' : '#f6f7f9'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
